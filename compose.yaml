name: skad

services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${R2_ACCESS_KEY_ID:-SKADLOCAL}
      RUSTFS_SECRET_KEY: ${R2_SECRET_ACCESS_KEY:-skad-local-development-secret}
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:4000,http://127.0.0.1:4000
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rustfs-create-bucket:
    image: rustfs/rc:v0.1.30
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${R2_ACCESS_KEY_ID:-SKADLOCAL}
      RUSTFS_SECRET_KEY: ${R2_SECRET_ACCESS_KEY:-skad-local-development-secret}
      R2_BUCKET: ${R2_BUCKET:-skad-private}
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/rc alias set local http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}" --region us-east-1 --bucket-lookup path
        /usr/bin/rc mb --ignore-existing "local/$${R2_BUCKET}"
    restart: "no"

volumes:
  rustfs-data:
